name: sh1-tooling

on:
  push:
    branches: [main, 'session-host-f/**', 'task-board/story/**']
  pull_request:

permissions:
  contents: read

jobs:
  tooling:
    name: tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Format
        run: |
          gofmt -l tools/sh1 testdata/sh1-fixture > "$RUNNER_TEMP/sh1-format.txt"
          test ! -s "$RUNNER_TEMP/sh1-format.txt"
      - name: Vet
        run: go vet ./tools/sh1/...
      - name: Unit and refusal tests
        run: go test -race -count=1 -skip TestFixtureEndToEnd ./tools/sh1/...
      - name: Build
        run: go build ./tools/sh1/...
      - name: Fixture end to end and deterministic repeat
        env:
          SH1_ARTIFACT_DIR: ${{ runner.temp }}/sh1-evidence
        run: go test -v -count=1 -run '^TestFixtureEndToEnd$' ./tools/sh1/...
      - name: Environment identity
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sh1-evidence"
          go version > "$RUNNER_TEMP/sh1-evidence/go-version.txt"
          go env GOOS GOARCH GOVERSION GOTOOLCHAIN > "$RUNNER_TEMP/sh1-evidence/go-environment.txt"
          go list -m all > "$RUNNER_TEMP/sh1-evidence/tooling-module-graph.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/sh1-evidence/public-identities.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sh1-${{ matrix.os }}
          path: ${{ runner.temp }}/sh1-evidence
          if-no-files-found: error
